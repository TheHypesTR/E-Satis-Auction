<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header { color: #d9534f; border-bottom: 2px solid #f4f4f4; padding-bottom: 10px; margin-bottom: 20px; }
        .button { display: inline-block; padding: 12px 24px; background-color: #d9534f; color: #ffffff !important; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #777; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="header">{{PlatformName}}</h2>
    <p>{{Greeting}} <strong>{{FirstName}}</strong>,</p>

    <p>{{BodyText}}</p>

    <div style="text-align: center; display: {{ButtonDisplay}};">
        <a href="{{ActionLink}}" class="button">{{ButtonText}}</a>
        <p style="margin-top: 25px; text-align: left;">{{FallbackText}}</p>
        <p style="font-size: 13px; word-break: break-all; color: #555; text-align: left;">{{ActionLink}}</p>
    </div>

    <div class="footer">
        <p>{{SecurityNotice}}</p>
        <p>&copy; 2026 {{PlatformName}}. {{AllRightsReserved}}</p>
    </div>
</div>
</body>
</html>
